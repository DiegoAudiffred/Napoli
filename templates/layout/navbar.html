{% load static %}
<style>
    .custom-navbar {
        background-color: var(--bs-primary);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(10px);
    }

    .custom-nav-link {
        position: relative;
        color: rgba(255, 255, 255, 0.85) !important;
        padding: 0.5rem 1rem !important;
        border-radius: 8px;
        transition: all 0.3s ease-in-out;
        white-space: nowrap;
    }

    .custom-nav-link:hover {
        color: #ffffff !important;
        background-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
    }

    .custom-nav-link::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 50%;
        width: 0;
        height: 2px;
        background-color: #ffffff;
        transition: all 0.3s ease-in-out;
        transform: translateX(-50%);
        border-radius: 2px;
    }

    .custom-nav-link:hover::after,
    .custom-nav-link.active::after {
        width: 60%;
    }

    .custom-nav-link.active {
        color: #ffffff !important;
        font-weight: 600;
        background-color: rgba(255, 255, 255, 0.1);
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top py-2">
    <div class="container-fluid px-3 px-lg-5">
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto gap-lg-2 text-center align-items-center">

                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'Index:index' %}" class="nav-link custom-nav-link active">
                        Inicio
                    </a>
                </li>

                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'Ventas:ventasIndex' %}" class="nav-link custom-nav-link">
                        Ventas
                    </a>
                </li>

                {% if user.rol == "Admin" or user.rol == "Dueña/o" %}
                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'Empleados:empleadosIndex' %}" class="nav-link custom-nav-link">
                        Empleados
                    </a>
                </li>
                {% endif %}

                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'Menu:menuIndex' %}" class="nav-link custom-nav-link">
                        Menú
                    </a>
                </li>

                {% if user.rol == "Admin" or user.rol == "Dueña/o" %}
                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'tickets:ticketsIndex' %}" class="nav-link custom-nav-link">
                        Tickets
                    </a>
                </li>

                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'VentaMenuEliminado:VentaMenuEliminadoIndex' %}" class="nav-link custom-nav-link">
                        Cambios
                    </a>
                </li>
                {% endif %}

                <li class="nav-item fnTexto_Bold_Encabezado_006 my-auto">
                    <a href="{% url 'Corte:corteDeCajaIndex' %}" class="nav-link custom-nav-link">
                        Corte de Caja
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>
