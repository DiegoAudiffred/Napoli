{% load static %}
{% block body %}

<style>
    .upload-box {
        position: relative;
        width: 100%;
        height: 380px;
        border: 2px dashed #dee2e6;
        border-radius: 12px;
        overflow: hidden;
        background-color: #f8f9fa;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .upload-box:hover {
        border-color: var(--bs-primary);
        background-color: #f1f3f5;
    }

    .upload-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .upload-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        opacity: 0.8;
        transition: opacity 0.3s ease;
    }

    .upload-box:hover .upload-overlay {
        opacity: 1;
        background: rgba(0, 0, 0, 0.45);
    }

    .form-floating-custom {
        border-radius: 8px;
        overflow: hidden;
    }

    .form-floating-custom .input-group-text {
        border-right: none;
        background-color: #ffffff;
    }

    .form-floating-custom .form-control,
    .form-floating-custom .form-select {
        border-left: none;
    }

    .form-floating-custom .form-control:focus,
    .form-floating-custom .form-select:focus {
        box-shadow: none;
    }
</style>

<div class="container py-4">
    <form action="{% url 'Menu:menuCrear' %}" method="POST" enctype="multipart/form-data" id="user-profile-form">
        {% csrf_token %}

        <div class="row g-4 align-items-start">
            <div class="col-lg-5 col-md-6 col-12">
                <label for="id_url" class="upload-box shadow-sm d-block">
                    <img src="{% static 'img/fondogris.png' %}" alt="Previsualización" id="output">
                    <div class="upload-overlay">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span class="fw-bold">Haz clic para subir imagen</span>
                        <small class="text-white-50">PNG, JPG o WEBP</small>
                    </div>
                </label>
                
                <input type="file" name="url" id="id_url" class="d-none" accept="image/*" onchange="previewImage(event)">
            </div>

            <div class="col-lg-7 col-md-6 col-12">
                <div class="row g-3">
                    
                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold mb-1">Nombre del producto</label>
                        <div class="input-group form-floating-custom shadow-sm border rounded-3">
                            <span class="input-group-text text-secondary">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 14a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/></svg>
                            </span>
                            {{ form.nombre }}
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold mb-1">Precio</label>
                        <div class="input-group form-floating-custom shadow-sm border rounded-3">
                            <span class="input-group-text text-secondary">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            </span>
                            {{ form.precio }}
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold mb-1">Descripción</label>
                        <div class="input-group form-floating-custom shadow-sm border rounded-3">
                            <span class="input-group-text text-secondary">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            </span>
                            {{ form.descripcion }}
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold mb-1">Categoría</label>
                        <div class="input-group form-floating-custom shadow-sm border rounded-3">
                            <span class="input-group-text text-secondary">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                            </span>
                            {{ form.categoria }}
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold mb-1">Ingredientes</label>
                        <div class="input-group form-floating-custom shadow-sm border rounded-3" style="max-height: 150px; overflow-y: auto;">
                            <span class="input-group-text text-secondary align-items-start pt-2">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </span>
                            {{ form.ingredientes }}
                        </div>
                    </div>

                    <div class="col-12 pt-3 d-flex justify-content-end gap-2">
                        <button class="btn btn-outline-secondary px-4 rounded-3" type="button" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary px-4 rounded-3 text-white fw-bold shadow-sm">
                            Guardar
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </form>
</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const output = document.getElementById('output');
            output.src = URL.createObjectURL(file);
            output.onload = function() {
                URL.revokeObjectURL(output.src);
            }
        }
    }
</script>

{% endblock %}
